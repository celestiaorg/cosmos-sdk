version: "2"

run:
  tests: true
  timeout: 15m
  allow-parallel-runners: true
  concurrency: 4

linters:
  default: none
  enable:
    - dogsled
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: ".*\\.pb\\.go$"
        linters:
          - all
      - path: ".*\\.pb\\.gw\\.go$"
        linters:
          - all
      - path: ".*\\.pulsar\\.go$"
        linters:
          - all
      - path: "server/grpc/gogoreflection/fix_registration.go"
        linters:
          - all
      - path: "testutil/testdata"
        linters:
          - all
      - text: "Use of weak random number generator"
        linters:
          - gosec
      - text: "ST1003:"
        linters:
          - staticcheck
      # FIXME: Disabled until staticcheck ships the fix from https://github.com/dominikh/go-tools/issues/389
      - text: "ST1016:"
        linters:
          - staticcheck
      - text: "ST1008:"
        linters:
          - staticcheck
      - path: "migrations"
        text: "SA1019:"
        linters:
          - staticcheck
      - text: "SA1019: codec.NewAminoCodec is deprecated" # TODO remove once migration path is set out
        linters:
          - staticcheck
      # Exclude quickfix suggestions from staticcheck (style suggestions, not errors)
      - text: "QF1"
        linters:
          - staticcheck
      # Exclude SA1019 deprecation warnings for now
      - text: "SA1019:"
        linters:
          - staticcheck
      # Exclude SA1029 context key warnings
      - text: "SA1029:"
        linters:
          - staticcheck
      # Exclude SA1032 argument order warnings (errors.Is)
      - text: "SA1032:"
        linters:
          - staticcheck
      # Exclude S1039 unnecessary sprintf warnings
      - text: "S1039:"
        linters:
          - staticcheck
  settings:
    gosec:
      includes:
        - G102
        - G103
        - G104
        - G106
        - G107
        - G108
        - G109
        - G110
        - G111
        - G112
        - G114
        - G201
        - G202
        - G203
        - G204
        - G301
        - G302
        - G303
        - G304
        - G305
        - G306
        - G307
        - G401
        - G402
        - G403
        - G404
        - G501
        - G502
        - G503
        - G504
        - G505
    misspell:
      locale: US
    dogsled:
      max-blank-identifiers: 6
    gocritic:
      disabled-checks:
        - regexpMust
        - appendAssign
        - ifElseChain

formatters:
  enable: []
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(cosmossdk.io)
        - prefix(github.com/cosmos/cosmos-sdk)
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 10000
  max-same-issues: 10000

name: Check for Go vulnerabilities
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: "Dependency Review"
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'release/v0.52.x-celestia' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fail-on-severity: high
          # These low-severity x/crisis advisories have no patched release.
          allow-ghsas: GHSA-qfc5-6r3j-jj22, GHSA-w5w5-2882-47pc
      - name: "Dependency audit"
        run: ./scripts/dep-assert.sh
      - name: "Go vulnerability check"
        run: make vulncheck
